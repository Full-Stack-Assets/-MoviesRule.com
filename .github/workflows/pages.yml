name: Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://moviesrule.com
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_PORTFOLIO_SITE_ID: moviesrule
          NEXT_PUBLIC_NEWSLETTER_SUBSCRIBE_URL: ${{ vars.NEXT_PUBLIC_NEWSLETTER_SUBSCRIBE_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-3754070789576502
          NEXT_PUBLIC_GOOGLE_CERTIFIED_CMP_ACTIVE: ${{ vars.NEXT_PUBLIC_GOOGLE_CERTIFIED_CMP_ACTIVE }}
          NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          NEXT_PUBLIC_ADSENSE_SLOT_FOOTER: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_FOOTER }}
        run: npm run build
      - name: Verify custom-domain artifact contract
        run: |
          test -f out/index.html
          test -f out/CNAME
          grep -q '/_next/' out/index.html
          if grep -q '/-MoviesRule.com/_next/' out/index.html; then
            echo 'Project-path assets leaked into the custom-domain artifact.' >&2
            exit 1
          fi
          grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3754070789576502' out/index.html
          grep -q 'google-adsense-account' out/index.html
          grep -q 'ca-pub-3754070789576502' out/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
