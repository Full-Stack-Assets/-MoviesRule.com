name: Hourly Post Candidate Generation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-post-candidate-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx tsx scripts/run-local.ts

      - name: Validate generated candidate
        run: |
          npm run typecheck
          npm run typecheck:test
          npm run lint
          npm test
          npm run build

      - name: Commit candidate content
        env:
          CANDIDATE_BRANCH: automation/content-candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moviesrule-bot"
          git config user.email "bot@moviesrule.com"
          git config merge.topiclog.name "union topic log entries"
          git config merge.topiclog.driver "node scripts/merge-topic-log.mjs %O %A %B"

          git add content/
          if git diff --cached --quiet; then
            echo "No new candidate generated."
            exit 0
          fi

          git commit -m "content: candidate $(date -u +%Y-%m-%dT%H:00Z)"
          remote_sha="$(git ls-remote --heads origin "${CANDIDATE_BRANCH}" | awk '{print $1}')"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:${remote_sha}" origin "HEAD:${CANDIDATE_BRANCH}"
          else
            git push origin "HEAD:${CANDIDATE_BRANCH}"
          fi
          echo "Candidate content pushed to ${CANDIDATE_BRANCH}; production was not deployed."
